title: LaonCode
description: 어느 한 대학생의 코딩 일지
url: "https://Laoncode.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul
permalink: /:categories/:title/
markdown: kramdown
highlighter: none
kramdown:
  syntax_highlighter: null
  smart_quotes: [apos, apos, quot, quot]
  typographic_symbols: {mdash: '---', ndash: '--', hellip: '...', laquo: '<<', raquo: '>>'}
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
paginate: 10
paginate_path: "/page:num/"
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Laon
exclude:
  - image-map.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - templates
  - WRITING-GUIDE.md

featured_categories:
  - "개발"
  - "CTF/Wargame"
  - "Bug Bounty"
  - "블로그/기술문서"
  - "논문/컨퍼런스"
  - "공모전/자격증"
